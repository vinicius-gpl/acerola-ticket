[tools]
go = "1.27.1"
golangci-lint = "latest"

[tasks.fmt]
description = "Verifica formatação (gofmt); falha se algum arquivo precisar de ajuste"
run = "gofmt -l ."

[tasks."fmt:fix"]
description = "Aplica a formatação (gofmt -w)"
run = "gofmt -w ."

[tasks.vet]
description = "go vet — erros que o compilador não pega"
run = "go vet ./..."

[tasks.lint]
description = "golangci-lint — linter completo"
run = "golangci-lint run ./..."

[tasks.test]
description = "Testes do Go (src-go/...)"
run = "go test ./..."

[tasks."frontend:lint"]
description = "Prettier --check no frontend"
run = "npm run lint --prefix svelte"

[tasks."frontend:test"]
description = "Testes do frontend (vitest)"
run = "npm run test --prefix svelte"

[tasks."frontend:check"]
description = "Typecheck do frontend (svelte-check)"
run = "npm run check --prefix svelte"

[tasks."frontend:storybook"]
description = "Sobe o Storybook (revisão visual dos componentes)"
run = "npm run storybook --prefix svelte"

[tasks."frontend:storybook:build"]
description = "Build estático do Storybook — valida que todas as stories compilam"
run = "npm run build-storybook --prefix svelte"

[tasks.build]
description = "Build de produção via Wails (no Windows gera o .exe final; no Linux, o binário do Linux)"
# -s -w: remove símbolos de depuração e a tabela DWARF do binário final — o
# netbird faz o mesmo no build deles (.goreleaser_ui.yaml). Não afeta o
# funcionamento, só deixa o .exe menor.
run_windows = "wails build -ldflags \"-s -w\""
# No Linux o Wails usa o WebKitGTK. As distribuições novas (Fedora, Ubuntu
# 24.04+) só trazem a versão 4.1, e o Wails só a aceita com a tag webkit2_41.
run = """
tags=$(pkg-config --exists webkit2gtk-4.1 && echo "-tags webkit2_41" || true)
wails build $tags -ldflags "-s -w"
"""

[tasks.dev]
description = "Roda em modo dev (bandeja + painel, hot-reload)"
run_windows = "wails dev"
# Mesma tag do build — ver o comentário em tasks.build.
run = """
tags=$(pkg-config --exists webkit2gtk-4.1 && echo "-tags webkit2_41" || true)
wails dev $tags
"""

[tasks.check]
description = "Tudo que precisa passar antes de considerar o trabalho pronto"
depends = [
	"fmt",
	"vet",
	"lint",
	"test",
	"frontend:lint",
	"frontend:check",
	"frontend:test",
	"frontend:storybook:build",
	"build"
]

[tasks.setup]
description = "Instala a CLI do Wails e, no Linux, as bibliotecas do sistema (uma vez, ou após trocar versão do Go)"
run_windows = "go install github.com/wailsapp/wails/v2/cmd/wails@latest"
# No Linux o Wails compila contra o GTK e o WebKitGTK do sistema; sem os
# pacotes de desenvolvimento deles o `wails dev` nem começa. Pede a senha
# de administrador (sudo).
run = """
if command -v dnf >/dev/null; then
  sudo dnf install -y gcc pkgconf-pkg-config gtk3-devel webkit2gtk4.1-devel
elif command -v apt-get >/dev/null; then
  sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
else
  echo "Instale à mão o GTK 3 e o WebKitGTK 4.1 (pacotes de desenvolvimento) — rode 'wails doctor' para ver o que falta."
fi
go install github.com/wailsapp/wails/v2/cmd/wails@latest
"""