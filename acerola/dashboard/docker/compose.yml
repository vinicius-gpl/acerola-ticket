# Este compose sobe só a aplicação — um container só, que responde `/api`, serve o SPA na mesma
# porta e sobe junto o bot de WhatsApp em `127.0.0.1:4005` quando configurado.
#
# O banco (Postgres, Neon) e os arquivos (Cloudflare R2) são remotos: o único volume (`bot-data`)
# guarda as conexões cifradas dos números de WhatsApp vinculados. O container só precisa das
# variáveis do `server/.env` (DATABASE_URL, R2_*) pra subir — sem elas, o server recusa iniciar.
#
# Em produção fica atrás de um Traefik (ex.: Coolify), que resolve domínio e TLS;
# localmente é só `-p 3005:3005`.
services:
  app:
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - path: ../server/.env
        required: false
      - path: ../bot/.env
        required: false
    ports:
      - '3005:3005'
    volumes:
      - bot-data:/data
    # SAÚDE DE VERDADE, não "o processo está de pé".
    #
    # `/api/health` só responde 200 depois de conseguir falar com o banco. Sem isto, uma
    # partida que falhou na conexão parecia uma partida boa: o container ficava no ar
    # respondendo erro a todo mundo, e o Traefik continuava mandando gente para ele.
    #
    # O teste é feito com o `node` que já está na imagem — nada de instalar `curl` só pra isso.
    # `start_period` dá tempo às migrations, que o server aplica sozinho ao subir.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.API_PORT || 3005) + '/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  bot-data:
