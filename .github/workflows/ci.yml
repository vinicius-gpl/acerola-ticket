# O mesmo portão do Definition of Done (CONTRIBUTING §14), rodando fora da máquina de quem
# programa. O hook de pre-commit some com um `--no-verify`; isto aqui não.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A pasta do projeto, e nao a de cima: o `package.json` e o `package-lock.json` moram em
# `acerola/dashboard`. Aponta para `acerola` e o `npm ci` falha em 14 segundos dizendo que nao
# existe lockfile — e nada depois dele chega a rodar.
defaults:
  run:
    working-directory: acerola/dashboard

jobs:
  verify:
    runs-on: ubuntu-latest
    # Valores de mentira, só para o server conseguir SUBIR durante o teste E2E — sem
    # TEST_DATABASE_URL (que não é segredo nenhum, e continua sem valor aqui de propósito),
    # a suíte E2E é pulada antes de usar qualquer um destes. Nenhuma chamada de verdade ao
    # Postgres, ao R2 ou ao Neon Auth acontece com eles.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost/ci_placeholder
      R2_ACCOUNT_ID: ci-placeholder
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_BUCKET: ci-placeholder
      NEON_AUTH_URL: https://ci-placeholder.invalid/auth
    steps:
      - uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: acerola/dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Regras das skills design-system e ui-standards, para os dois apps Svelte. Só reprova
      # violação NOVA (fora da baseline em .claude/hooks/design/design-baseline.json).
      # O atalho `check:design` saiu do package.json (hoje é `mise run design:check`, na raiz);
      # aqui chama-se o script direto. Ele acha a raiz do repositório pelo próprio caminho.
      - run: node ../../.claude/hooks/design/check-design.mjs
      - run: npm test
      - run: npm run test:e2e -w server
      - run: npm run build
