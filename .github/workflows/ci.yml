# O mesmo portão do Definition of Done (CONTRIBUTING §14), rodando fora da máquina de quem
# programa. O hook de pre-commit some com um `--no-verify`; isto aqui não.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    working-directory: template

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e -w server
      - run: npm run build
